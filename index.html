<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0d14">
<title>峠アタック</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--acc:#ff7a1a;--acc2:#ffd400;--ink:#f4f1ea;--dim:#9aa0b4;--panel:rgba(10,12,20,.78)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0d14;color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.hide{display:none!important}
.num{font-family:Orbitron,monospace;font-weight:800;letter-spacing:.02em}
.head{font-family:"Dela Gothic One","Hiragino Kaku Gothic ProN",sans-serif}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
#tl{position:absolute;left:max(12px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));background:var(--panel);padding:8px 14px 10px;border-left:4px solid var(--acc);transform:skewX(-8deg)}
#tl>*{transform:skewX(8deg)}
#tl .lbl{font-size:11px;color:var(--dim);letter-spacing:.15em}
#time{font-size:30px;line-height:1.05}
#best{font-size:14px;color:var(--acc2)}
#prog{margin-top:6px;width:170px;height:6px;background:#2a2e3e;border-radius:3px;overflow:hidden}
#prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2))}
#br{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));text-align:right;background:var(--panel);padding:8px 16px 10px;border-right:4px solid var(--acc);transform:skewX(-8deg)}
#br>*{transform:skewX(8deg)}
#spd{font-size:54px;line-height:1}
#spd small{font-size:14px;color:var(--dim);margin-left:4px}
#gear{font-size:18px;color:var(--acc2)}
#rpm{width:180px;height:8px;background:#2a2e3e;border-radius:4px;overflow:hidden;margin-top:4px;margin-left:auto}
#rpm i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3ad07a,var(--acc2) 70%,#ff3a3a)}
#mini{position:absolute;right:max(12px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));width:130px;height:130px;background:var(--panel);border-radius:8px}
#drift{position:absolute;left:50%;top:18%;transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .2s}
#drift .d1{font-size:20px;color:var(--acc2);letter-spacing:.2em}
#drift .d2{font-size:44px;text-shadow:0 2px 0 #000,0 0 18px rgba(255,122,26,.7)}
#drift .d3{font-size:16px;color:#fff}
#msg{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:88px;text-shadow:0 4px 0 #000,0 0 30px rgba(255,122,26,.8);white-space:nowrap}
#total{position:absolute;left:max(12px,env(safe-area-inset-left));top:130px;font-size:13px;color:var(--dim);background:var(--panel);padding:4px 10px}
#total b{color:var(--acc2);font-size:16px}
#topbtns{position:absolute;right:max(150px,calc(env(safe-area-inset-right) + 150px));top:max(10px,env(safe-area-inset-top));display:flex;gap:8px;pointer-events:auto}
.sbtn{background:var(--panel);border:1px solid #444a60;color:var(--ink);font:inherit;font-size:14px;padding:8px 12px;border-radius:8px;cursor:pointer}
/* touch */
#touch{position:fixed;inset:auto 0 0 0;height:180px;pointer-events:none}
.tb{position:absolute;pointer-events:auto;border:3px solid rgba(255,255,255,.75);background:rgba(20,22,36,.55);color:#fff;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:bold;touch-action:none}
.tb.on{background:rgba(255,122,26,.65)}
.tb small{font-size:13px}
#tLeft{left:max(14px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:84px;height:110px}
#tRight{left:calc(max(14px,env(safe-area-inset-left)) + 96px);bottom:max(18px,env(safe-area-inset-bottom));width:84px;height:110px}
#tGas{right:max(14px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));width:92px;height:124px;background:rgba(40,160,80,.55);flex-direction:column}
#tBrake{right:calc(max(14px,env(safe-area-inset-right)) + 104px);bottom:max(18px,env(safe-area-inset-bottom));width:80px;height:84px;background:rgba(200,40,50,.5);flex-direction:column}
#tHand{right:calc(max(14px,env(safe-area-inset-right)) + 104px);bottom:calc(max(18px,env(safe-area-inset-bottom)) + 96px);width:80px;height:60px;font-size:15px;flex-direction:column}
body.touch #br{bottom:auto;top:150px;right:max(12px,env(safe-area-inset-right))}
body.touch #spd{font-size:36px}
body.touch #rpm{width:120px}
/* screens */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;background:radial-gradient(ellipse at center,rgba(5,6,12,.35),rgba(5,6,12,.75))}
.logo{font-size:min(15vw,96px);line-height:1;color:#fff;text-shadow:0 5px 0 #000,0 0 40px rgba(255,122,26,.75);transform:skewX(-10deg)}
.logo2{font-family:Orbitron,sans-serif;font-weight:800;letter-spacing:.5em;color:var(--acc);font-size:min(4.2vw,20px);margin-top:-6px}
.btn{font-family:"Dela Gothic One",sans-serif;font-size:22px;color:#111;background:linear-gradient(180deg,var(--acc2),var(--acc));border:0;padding:14px 38px;border-radius:6px;transform:skewX(-10deg);cursor:pointer;box-shadow:0 4px 0 #8a3a00}
.btn span{display:inline-block;transform:skewX(10deg)}
.btn.sub{background:#2a2e40;color:var(--ink);box-shadow:0 4px 0 #111;font-size:17px;padding:10px 26px}
.btn:active{transform:skewX(-10deg) translateY(3px);box-shadow:0 1px 0 #8a3a00}
.hint{color:var(--dim);font-size:13px;text-align:center;line-height:1.8}
#select{justify-content:flex-end;padding-bottom:max(22px,env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(5,6,12,0) 40%,rgba(5,6,12,.85))}
#selTitle{position:absolute;top:max(14px,env(safe-area-inset-top));left:0;right:0;text-align:center;font-size:22px;letter-spacing:.1em}
.card{width:min(560px,94vw);background:var(--panel);border:1px solid #3a3f58;border-radius:12px;padding:14px 18px;display:grid;grid-template-columns:auto 1fr auto;gap:8px 14px;align-items:center}
.arrow{font-size:30px;width:52px;height:52px;border-radius:50%;border:2px solid #fff;background:transparent;color:#fff;cursor:pointer}
#carName{font-size:30px;color:#fff}
#carType{font-size:13px;color:var(--acc2);letter-spacing:.1em}
#carDesc{font-size:14px;color:var(--ink);line-height:1.6;margin-top:4px}
.stats{grid-column:1/4;display:grid;grid-template-columns:auto 1fr auto 1fr;gap:6px 10px;font-size:12px;color:var(--dim);align-items:center}
.bar{height:8px;background:#2a2e3e;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.selfoot{grid-column:1/4;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}
#carBest{color:var(--acc2)}
.tog{display:flex;align-items:center;gap:6px;cursor:pointer}
.tog input{width:18px;height:18px;accent-color:var(--acc)}
#finTime{font-size:min(14vw,72px)}
#finRec{color:var(--acc2);font-size:22px}
#finInfo{color:var(--ink);font-size:15px;text-align:center;line-height:1.8}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
@media (max-height:500px){.logo{font-size:64px}#finTime{font-size:52px}.card{padding:10px 14px}#carDesc{display:none}}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="hud" class="hide">
  <div id="tl"><div class="lbl">TIME</div><div id="time" class="num">0:00.000</div><div id="best" class="num">BEST --:--.---</div><div id="prog"><i></i></div></div>
  <div id="total">ドリフト <b id="dtotal" class="num">0</b></div>
  <canvas id="mini" width="260" height="260"></canvas>
  <div id="topbtns"><button class="sbtn" id="bCam">カメラ</button><button class="sbtn" id="bPause">II</button></div>
  <div id="br"><div id="spd" class="num">0<small>km/h</small></div><div id="gear" class="num">N</div><div id="rpm"><i></i></div></div>
  <div id="drift"><div class="d1 head">DRIFT</div><div class="d2 num" id="dScore">0</div><div class="d3" id="dInfo"></div></div>
  <div id="msg" class="num"></div>
</div>

<div id="touch" class="hide">
  <div class="tb" id="tLeft">◀</div>
  <div class="tb" id="tRight">▶</div>
  <div class="tb" id="tHand">サイド<small>ブレーキ</small></div>
  <div class="tb" id="tBrake">■<small>ブレーキ</small></div>
  <div class="tb" id="tGas">▲<small>アクセル</small></div>
</div>

<div id="title" class="screen">
  <div class="logo head">峠アタック</div>
  <div class="logo2">TOUGE ATTACK</div>
  <div style="height:18px"></div>
  <button class="btn" id="bStart"><span>スタート</span></button>
  <div class="hint" id="kbHint">↑ アクセル　↓ ブレーキ・バック　← → ハンドル<br>スペース サイドブレーキ　R やりなおし　C カメラ　Esc ポーズ</div>
</div>

<div id="select" class="screen hide">
  <div id="selTitle" class="head">クルマを えらぶ</div>
  <div class="card">
    <button class="arrow" id="prevCar">◀</button>
    <div><div id="carType"></div><div id="carName" class="head"></div><div id="carDesc"></div></div>
    <button class="arrow" id="nextCar">▶</button>
    <div class="stats" id="stats"></div>
    <div class="selfoot">
      <span>ベスト <b id="carBest" class="num">--:--.---</b></span>
      <label class="tog"><input type="checkbox" id="assist" checked>ドリフトアシスト</label>
    </div>
  </div>
  <div class="row"><button class="btn sub" id="bBack"><span>もどる</span></button><button class="btn" id="bGo"><span>このクルマで走る</span></button></div>
</div>

<div id="pause" class="screen hide">
  <div class="logo head" style="font-size:56px">ポーズ</div>
  <div class="row"><button class="btn" id="bResume"><span>つづける</span></button></div>
  <div class="row"><button class="btn sub" id="bRetry"><span>やりなおす</span></button><button class="btn sub" id="bToSel"><span>クルマをえらぶ</span></button></div>
  <div class="row"><button class="btn sub" id="bMute"><span>おと：ON</span></button></div>
</div>

<div id="finish" class="screen hide">
  <div class="logo head" style="font-size:64px">GOAL!</div>
  <div id="finTime" class="num">0:00.000</div>
  <div id="finRec" class="head"></div>
  <div id="finInfo"></div>
  <div class="row"><button class="btn" id="bAgain"><span>もういちど</span></button><button class="btn sub" id="bFinSel"><span>クルマをえらぶ</span></button></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const wrapA=a=>{while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a;};
const isTouch=matchMedia('(pointer:coarse)').matches;
if(isTouch)document.body.classList.add('touch');
const G=9.81;

/* =============== レンダラー =============== */
const renderer=new THREE.WebGLRenderer({canvas:$('gl'),antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,isTouch?1.5:2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const FOG='#d9a07c';
scene.fog=new THREE.Fog(FOG,90,520);
scene.background=new THREE.Color(FOG);
const camera=new THREE.PerspectiveCamera(62,1,0.1,2000);
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?78:62;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

const hemi=new THREE.HemisphereLight('#ffe2c4','#3b4a2c',.8);scene.add(hemi);
const sun=new THREE.DirectionalLight('#ffcf9a',.95);
sun.castShadow=true;sun.shadow.mapSize.set(isTouch?1024:2048,isTouch?1024:2048);
Object.assign(sun.shadow.camera,{left:-35,right:35,top:35,bottom:-35,near:1,far:300});
sun.shadow.bias=-.0008;scene.add(sun);scene.add(sun.target);
const SUN_OFF=new THREE.Vector3(-70,110,-50);

// 空
{
  const g=new THREE.SphereGeometry(1400,32,16);const col=[];const p=g.attributes.position;
  const top=new THREE.Color('#25416e'),mid=new THREE.Color('#f0a46a'),low=new THREE.Color('#c98a66');
  for(let i=0;i<p.count;i++){const y=p.getY(i)/1400;const c=y>0?mid.clone().lerp(top,Math.pow(y,.6)):mid.clone().lerp(low,Math.min(1,-y*4));col.push(c.r,c.g,c.b);}
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  const sky=new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide,fog:false,depthWrite:false}));
  sky.renderOrder=-10;scene.add(sky);scene.userData.sky=sky;
  const sunDisc=new THREE.Mesh(new THREE.CircleGeometry(40,24),new THREE.MeshBasicMaterial({color:'#fff1c8',fog:false}));
  sunDisc.position.set(-700,180,-500);sunDisc.lookAt(0,0,0);sky.add(sunDisc);
}

/* =============== コース =============== */
const SEGS=[['S',60],['R',80,40],['S',50],['L',60,70],['S',40],['L',40,40],['S',90],
  ['R',14,180],['S',130],['L',15,180],['S',70],['R',35,60],['L',35,60],['S',40],
  ['R',16,170],['S',110],['L',60,70],['S',50],['R',45,80],['L',30,100],['S',40],['R',70,50],['S',120]];
const ROAD_W=8.6,SHOULDER=1.5,RAIL=ROAD_W/2+SHOULDER;
const TX=[],TZ=[],TY=[],TH=[],TS=[];
(function genPath(){
  let x=0,z=0,h=0;const P=[[x,z]];
  for(const s of SEGS){
    if(s[0]==='S'){for(let i=0;i<s[1];i++){x+=Math.sin(h);z+=Math.cos(h);P.push([x,z]);}}
    else{const R=s[1],ang=s[2]*Math.PI/180,n=Math.max(2,Math.round(R*ang)),d=s[0]==='L'?1:-1;
      for(let i=0;i<n;i++){h+=d*ang/n;x+=Math.sin(h)*R*ang/n;z+=Math.cos(h)*R*ang/n;P.push([x,z]);}}
  }
  for(let i=0;i<P.length;i+=2){TX.push(P[i][0]);TZ.push(P[i][1]);}
})();
const N=TX.length;
let zmax=0;for(const z of TZ)zmax=Math.max(zmax,z);
const SLOPE=.10;
const planeY=(x,z)=>120-SLOPE*z+Math.sin(x*.01)*3;
for(let i=0;i<N;i++){
  TY.push(planeY(TX[i],TZ[i]));
  const a=Math.max(0,i-1),b=Math.min(N-1,i+1);TH.push(Math.atan2(TX[b]-TX[a],TZ[b]-TZ[a]));
  TS.push(i?TS[i-1]+Math.hypot(TX[i]-TX[i-1],TZ[i]-TZ[i-1]):0);
}
const START_I=8,FIN_I=N-10;
// 近傍検索用グリッド
const CELL=16,grid=new Map();
for(let i=0;i<N;i++){const k=Math.floor(TX[i]/CELL)+','+Math.floor(TZ[i]/CELL);if(!grid.has(k))grid.set(k,[]);grid.get(k).push(i);}
function nearestRoad(x,z){
  const cx=Math.floor(x/CELL),cz=Math.floor(z/CELL);let best=1e18,bi=0;
  for(let r=0;r<14;r++){
    for(let dx=-r;dx<=r;dx++)for(let dz=-r;dz<=r;dz++){
      if(Math.max(Math.abs(dx),Math.abs(dz))!==r)continue;
      const L=grid.get((cx+dx)+','+(cz+dz));if(!L)continue;
      for(const i of L){const d=(TX[i]-x)**2+(TZ[i]-z)**2;if(d<best){best=d;bi=i;}}
    }
    if(best<((r)*CELL)**2)break;
  }
  if(best===1e18){for(let i=0;i<N;i++){const d=(TX[i]-x)**2+(TZ[i]-z)**2;if(d<best){best=d;bi=i;}}}
  return [Math.sqrt(best),bi];
}
// ノイズ
function hash(x,y){const h=Math.sin(x*127.1+y*311.7)*43758.5453;return h-Math.floor(h);}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,s=t=>t*t*(3-2*t);
  return lerp(lerp(hash(xi,yi),hash(xi+1,yi),s(xf)),lerp(hash(xi,yi+1),hash(xi+1,yi+1),s(xf)),s(yf));}
const fbm=(x,z)=>vnoise(x*.012,z*.012)*.6+vnoise(x*.03+9,z*.03+3)*.3+vnoise(x*.08+4,z*.08+7)*.1;
function terrainY(x,z){
  const [d,i]=nearestRoad(x,z);
  const w=smooth(RAIL+3.5,RAIL+30,d);
  const far=Math.max(0,d-55)*.32;
  const h=planeY(x,z)+(fbm(x,z)-.45)*34*w+far*w;
  return lerp(TY[i]-.9,h,w);
}
let bx0=1e9,bx1=-1e9,bz0=1e9,bz1=-1e9;for(let i=0;i<N;i++){bx0=Math.min(bx0,TX[i]);bx1=Math.max(bx1,TX[i]);bz0=Math.min(bz0,TZ[i]);bz1=Math.max(bz1,TZ[i]);}

function canvasTex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;}t.anisotropy=4;return t;}
function ribbon(off0,off1,y0,y1,mat,vScale,step){
  step=step||1;const pos=[],uv=[],idx=[];let k=0;
  for(let i=0;i<N;i+=step){
    const sx=Math.cos(TH[i]),sz=-Math.sin(TH[i]);
    pos.push(TX[i]+sx*off0,TY[i]+y0,TZ[i]+sz*off0, TX[i]+sx*off1,TY[i]+y1,TZ[i]+sz*off1);
    uv.push(0,TS[i]/vScale,1,TS[i]/vScale);
    if(k){const a=(k-1)*2;if(off0>off1)idx.push(a,a+1,a+2,a+1,a+3,a+2);else idx.push(a,a+2,a+1,a+1,a+2,a+3);}k++;
  }
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);g.computeVertexNormals();
  return new THREE.Mesh(g,mat);
}
(function buildTrack(){
  // 路面
  const roadTex=canvasTex(128,256,(c,w,h)=>{
    c.fillStyle='#3d3f44';c.fillRect(0,0,w,h);
    for(let i=0;i<1600;i++){const v=40+Math.random()*50|0;c.fillStyle=`rgb(${v},${v},${v+4})`;c.fillRect(Math.random()*w,Math.random()*h,2,2);}
    c.fillStyle='#e8e8e2';c.fillRect(5,0,4,h);c.fillRect(w-9,0,4,h);
    c.fillStyle='#ecece6';c.fillRect(w/2-2,0,4,h*.45);
  },true);
  const road=ribbon(ROAD_W/2,-ROAD_W/2,.03,.03,new THREE.MeshLambertMaterial({map:roadTex}),14);
  road.receiveShadow=true;scene.add(road);
  const gravel=new THREE.MeshLambertMaterial({color:'#7d6f58'});
  for(const s of [1,-1]){const m=ribbon(s*(RAIL+.4),s*ROAD_W/2,-.05,.02,gravel,10);m.receiveShadow=true;scene.add(m);}
  // ガードレール
  const railMat=new THREE.MeshLambertMaterial({color:'#f2f2ee',side:THREE.DoubleSide});
  for(const s of [1,-1]){
    scene.add(ribbon(s*RAIL,s*RAIL,.5,.85,railMat,10));
    const m=ribbon(s*(RAIL+.04),s*(RAIL+.04),.62,.72,new THREE.MeshLambertMaterial({color:'#c9c9c2',side:THREE.DoubleSide}),10);scene.add(m);
  }
  const postGeo=new THREE.BoxGeometry(.12,.9,.12),postMat=new THREE.MeshLambertMaterial({color:'#bfbfb8'});
  const cnt=Math.ceil(N/2)*2,posts=new THREE.InstancedMesh(postGeo,postMat,cnt);const M=new THREE.Matrix4();let k=0;
  for(let i=0;i<N;i+=2)for(const s of [1,-1]){const sx=Math.cos(TH[i]),sz=-Math.sin(TH[i]);M.makeTranslation(TX[i]+sx*s*(RAIL+.1),TY[i]+.42,TZ[i]+sz*s*(RAIL+.1));posts.setMatrixAt(k++,M);}
  posts.count=k;scene.add(posts);

function placeAt(c,i){

}
function trackLocate(c,full){

  for(let i=a;i<=b;i++){const d=(TX[i]-c.x)**2+(TZ[i]-c.z)**2;if(d<bd){bd=d;bi=i;}}

const GEARS5=[.27,.44,.62,.81,1.04],GEARS6=[.22,.36,.5,.65,.8,1.03];

  const dir=c.rev?-1:1;

  const mu=S.mu*(c.onGravel?.62:1);
  const limF=mu*Nf,limR=mu*Nr*S.gripR;

    const top=gr[c.gear-1]*vmax;

}

function aiInput(c,targetMul){

  const j=Math.min(N-1,c.idx+Math.round((5+spd*.5)/2));
  const dx=TX[j]-c.x,dz=TZ[j]-c.z;
  const fx=Math.sin(c.yaw),fz=Math.cos(c.yaw),sx=Math.cos(c.yaw),sz=-Math.sin(c.yaw);

  let k=0;for(let i=c.idx;i<Math.min(N-2,c.idx+Math.round(12+spd*.9));i++)k=Math.max(k,Math.abs(wrapA(TH[i+1]-TH[i]))/2);

  let th=clamp((vt-spd)/3,0,1);if(Math.abs(c.beta)>.18||c.wheelspin>.2)th*=.4;
  return {steer:clamp(ang/maxSteer*1.3,-1,1),throttle:th,brake:spd>vt+1.5?clamp((spd-vt)/4,0,1):0,hand:false};
}

    const t=performance.now()/1000*.35,r=player.spec.len*1.45+1.8;
    camera.position.set(player.x+Math.sin(t)*r,player.y+2.1,player.z+Math.cos(t)*r);camera.lookAt(player.x,player.y-(innerWidth<innerHeight?1.6:.7),player.z);
    sun.position.set(player.x+SUN_OFF.x,player.y+SUN_OFF.y,player.z+SUN_OFF.z);sun.target.position.set(player.x,player.y,player.z);
    scene.userData.sky.position.set(camera.position.x,0,camera.position.z);
  }else if(player&&(state==='race'||state==='count'||state==='finish'||state==='pause')){
    const c=player;syncMesh(c,playerMesh,dt);
    if(state!=='pause'){
      const sl=wheelFx(c,dt);
      updateCamera(c,dt,camMode);
      const spd=Math.hypot(c.vx,c.vz);
      if(c.hit>2.5){crash(c.hit);shake=Math.min(.6,c.hit*.06);c.hit=0;}
      const load=state==='count'?(c.revving?1:0):(c.thr||0);
      if(engine)setEngine(engine,c.rpm,load,1,load>.5&&c.rpm>c.spec.red*.985);
      if(tireSnd)tireSnd.g.gain.setTargetAtTime(muted?0:sl*.22,AC.currentTime,.05);
      if(windSnd)windSnd.g.gain.setTargetAtTime(muted?0:Math.min(.25,spd*spd*.00009),AC.currentTime,.1);
      // HUD
      $('spd').firstChild.textContent=Math.round(spd*3.6);
      $('gear').textContent=c.rev?'R':(spd<.5&&state==='count'?'N':c.gear);
      $('rpm').firstChild.style.width=clamp((c.rpm-c.spec.idle)/(c.spec.red-c.spec.idle),0,1)*100+'%';
      $('prog').firstChild.style.width=clamp((c.idx-START_I)/(FIN_I-START_I),0,1)*100+'%';
      let gpos=null;
      if(ghostPlay&&ghostMesh){
        const t=state==='count'?0:raceT,f=ghostPlay.f,i=Math.min(f.length-1,Math.floor(t/.05));
        if(i>=0&&i<f.length-1&&state!=='finish'){const k=(t-i*.05)/.05,A=f[i],B=f[i+1];
          gpos={x:lerp(A[0],B[0],k),z:lerp(A[1],B[1],k)};ghostMesh.visible=true;
          ghostMesh.position.set(gpos.x,lerp(A[2],B[2],k),gpos.z);ghostMesh.rotation.y=A[3]+wrapA(B[3]-A[3])*k;}
        else ghostMesh.visible=false;
      }
      drawMini(c,gpos);
      if(state==='count'){
        countT-=dt;const n=Math.ceil(countT-.6);
        const m=$('msg');const txt=n>0&&n<=3?String(n):'';
        if(m.dataset.t!==txt){m.dataset.t=txt;m.textContent=txt;if(txt)blip(520,.18,'square',.14);}
        if(countT<=.6){state='race';m.textContent='GO!';m.dataset.t='GO';blip(1040,.4,'square',.16);setTimeout(()=>{if($('msg').dataset.t==='GO'){$('msg').textContent='';$('msg').dataset.t='';}},800);}
      }else if(state==='race'){
        raceT+=dt;$('time').textContent=fmt(raceT);
        recT+=dt;while(recT>=.05){recT-=.05;ghostRec.push([+c.x.toFixed(2),+c.z.toFixed(2),+c.y.toFixed(2),+c.yaw.toFixed(3)]);}
        updateDrift(c,dt);
        const tdot=c.vx*Math.sin(TH[c.idx])+c.vz*Math.cos(TH[c.idx]);
        wrongT=tdot<-2?wrongT+dt:0;
        const m=$('msg');if(wrongT>1){if(m.dataset.t!=='W'){m.dataset.t='W';m.innerHTML='<span class="head" style="font-size:48px">ぎゃくそう!</span>';}}
        else if(m.dataset.t==='W'){m.dataset.t='';m.textContent='';}
        if(c.idx>=FIN_I)finishRace();
      }else if(state==='finish'){
        finT+=dt;if(finT>1.4&&$('finish').classList.contains('hide')){showScreen('finish');$('touch').classList.add('hide');}
      }
    }
  }
}
window.TA={ENGINE_WORKLET,get state(){return state;},get player(){return player;},CARS,N,START_I,FIN_I,TX,TZ,TY,TH,makeCarState,placeAt,stepCar,aiInput,trackLocate,keys,touchIn,
  accel(i){const c=makeCarState(CARS[i]);c.free=true;c.x=c.z=c.yaw=0;let t=0,t60=null,t100=null,q=null;const inp={steer:0,throttle:1,brake:0,hand:false};
    while(t<70){stepCar(c,inp,STEP,true);t+=STEP;const v=c.vz*3.6;if(t60==null&&v>=60)t60=t;if(t100==null&&v>=100)t100=t;if(q==null&&c.z>=402)q=t;}
    return {name:CARS[i].name,'0-60':t60&&+t60.toFixed(1),'0-100':t100&&+t100.toFixed(1),'400m':q&&+q.toFixed(1),top:Math.round(c.vz*3.6)};},
  run(sec){const n=Math.round(sec*120);for(let i=0;i<n;i++){if(state!=='pause')physics(STEP);if(i%2===0)update(STEP*2);}renderer.render(scene,camera);},
  sim(specIdx,assist,maxT){const c=makeCarState(CARS[specIdx]);placeAt(c,START_I);let t=0,hits=0;while(t<(maxT||300)&&c.idx<FIN_I){stepCar(c,aiInput(c,1),STEP,assist);if(c.hit>2)hits++;t+=STEP;}return {t:+t.toFixed(2),done:c.idx>=FIN_I,hits,idx:c.idx};}};
startDemo();
requestAnimationFrame(frame);
})();
</script>
